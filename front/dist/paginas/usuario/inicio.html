<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu espacio · Biblioteca Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../dist/CSS/style.css">
    <link rel="stylesheet" href="../../dist/CSS/movil.css">
</head>
<body>

    
    <div class="d-flex flex-column align-items-center justify-content-center py-5 mt-5">

        <p class="mt-3 text-muted">Verificando sesión...</p>
    </div>

    
    <div id="contenidoUsuario" class="d-none">
        <nav class="navbar navbar-dark bg-dark shadow-sm">
            <div class="container d-flex justify-content-between">
                <a class="navbar-brand fw-bold" href="../../index.html">Biblioteca Virtual</a>
                <button type="button" class="btn btn-sm btn-outline-light" id="btnSalir">Cerrar sesión</button>
            </div>
        </nav>

        <main class="container text-center py-5">
            <h1 class="fw-bold mb-3">¡Hola, <span id="nombreUsuario"></span>!</h1>
            <p class="lead text-muted">Tu espacio de lector, próximamente.</p>
        </main>

        <footer class="footer-custom text-white text-center py-4 mt-5">
            <div class="container">
                <p class="mb-0">Biblioteca Virtual · Santiago Fiore</p>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../dist/JS/api.js"></script>
