<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar · Biblioteca Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../dist/CSS/style.css">
    <link rel="stylesheet" href="../dist/CSS/movil.css">
    <style>
        
        .login-cuerpo {
            background: linear-gradient(135deg, #4a90e2 0%, #2c5a8c 100%);
            min-height: 100vh;
        }
        .login-tarjeta {
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
        }
        .login-marca {
            color: #2c3e50;
            font-size: 1.5rem;
            display: block;
            margin-bottom: 6px;
        }
        .btn-ingresar {
            background: #4a90e2;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            padding: 12px;
        }
        .btn-ingresar:hover {
            background: #2c5a8c;
        }
    </style>
</head>
<body class="login-cuerpo">

    <main class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="login-tarjeta">
            <a href="../index.html" class="login-marca fw-bold text-decoration-none">Biblioteca Virtual</a>
            <p class="text-muted mb-4">Ingresá con tu cuenta</p>

            
            <div id="mensajeError" class="alert alert-danger d-none" role="alert"></div>

            <form id="formLogin" novalidate>
                <div class="mb-3 text-start">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" autocomplete="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" autocomplete="current-password" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-ingresar w-100" id="btnIngresar">Ingresar</button>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../dist/JS/api.js"></script>
    <script src="../dist/JS/pages/login.js"></script>
</body>
</html>
