<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Virtual</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="dist/CSS/style.css">
    <link rel="stylesheet" href="dist/CSS/movil.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Biblioteca Virtual</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="">Contacto</a></li>
                    
                    <li class="nav-item d-flex align-items-center gap-2" id="zonaSesion"></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="hero-section text-center text-white d-flex align-items-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Tu conocimiento a un click</h1>
            <p class="lead">Explora nuestra colección de libros, revistas y más.</p>
            <a href="#catalogo" class="btn btn-light btn-lg mt-3 px-4 fw-bold">Ver Catálogo</a>
        </div>
    </header>

    <section id="catalogo" class="seccion-catalogo py-5">
        <div class="container">
            <h2 class="titulo-seccion text-center mb-4">Destacados <span>de la semana</span></h2>

            <div class="text-center mb-5" id="filtros">
                <button class="btn btn-filtro active" data-filtro="todos">Todos</button>
                <button class="btn btn-filtro" data-filtro="infantil">Infantil</button>
                <button class="btn btn-filtro" data-filtro="adultos">Adultos</button>
            </div>

            
            <div class="row" id="catalogoLibros"></div>
        </div>
    </section>

    <footer class="footer-custom text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">Biblioteca Virtual · Santiago Fiore</p>
        </div>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dist/JS/api.js"></script>
    <script src="dist/JS/app.js"></script>
</body>
</html>
